	这便是李洵要求的“全套”——从最贴身的、羞于示人的里衣，到包裹玉足的罗袜，再到这双精致的绣鞋。每一件，都将她身体最美的部分强调、包裹、呈现出来，却又欲遮还露，比彻底的赤裸更让人心痒难耐。
	
