	禁止上帝视角，禁止女主越级知晓不符合她身份的信息，禁止强行解说背景、直白铺垫悬念。
	
	
	禁止工整对仗的意象闭环，禁止所有景物描写都为烘托情绪服务，允许反差、允许无用、允许随性。
	
	
	禁止直白的心理描写，禁止模板化的比喻、堆砌的辞藻，所有表达必须贴合女主的视角与思维。
	
	
	禁止为了迎合爽点，违背人物的真实性格与选择，必须让人物活起来，而不是被剧情推着走。
	
	
