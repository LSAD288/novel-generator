	她身上穿的，早已不是那身标志性的、清冷如雪的白色衣裙。李洵给她的“任务衣物”，一件件，都透着精心算计过的诱惑。
	
	最里面，贴着她凝脂般肌肤的，是一件水红色的丝绸肚兜。那丝绸薄得近乎透明，勉强兜住她胸前饱胀的丰盈，顶端两粒小小的嫣红在丝料下清晰可见，随着她细微的呼吸和颤抖，若隐若现地起伏着。肚兜的系带松松地挂在颈后和细腰上，仿佛轻轻一扯便会全然散开。
	
	下身，则是一条同色的、丝绸质地的褒裤。同样轻薄，勉强遮住她最私密的地带，但丝绸紧贴肌肤，将那饱满隆起的丘陵形状、甚至中间那道隐秘凹陷的缝隙，都勾勒得清清楚楚。褒裤的裤腿只到大腿中段，将她一双修长笔直、毫无瑕疵的玉腿完全裸露出来。
	
	而这双玉腿，此刻正被一层纯白色的罗袜紧紧包裹着。罗袜是上好的软绸所制，质地细密光滑，从脚尖一路包裹到膝盖上方，用细细的丝带系住。罗袜的颜色纯白无瑕，与她肌肤的雪白相互映衬，却又因丝绸的质感而泛着柔和的光泽，将小腿优美的弧线、纤细的脚踝、以及那双天生玲珑的玉足，包裹得曲线毕露。罗袜很薄，能隐约看到底下肌肤的肉色，尤其是脚趾处，十粒宛如珍珠般圆润的趾头轮廓清晰可见，微微蜷缩着，透着一股难言的羞怯与诱惑。
	
