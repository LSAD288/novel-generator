	话未说完，这几个男子登时被淹没在苗女群中，被他们的母亲、姐姐、妹妹、阿姨、三姑、六婶乃至没关系不认识的苗女或手打。或脚踢，或揪发，或抓耳，或捶眼，或撞胸，总之漫天手脚一起下。鬼哭狼嚎顿时起，片刻之后，扑通扑通声音连着数声，这些男子个个头青面肿地被抛下了溪流，溅起来老大水花。
	
