	如果要有人胆敢冒犯大巫师，鬼厉丝毫也不怀疑，眼前这片土地上所有的苗人，甚至整个南疆的所有苗人都会冲过来和他拚命。
	
	小白饶有兴趣地看着鬼厉，微笑道：“如何，我们现在怎么办？”
	
	鬼厉看了她一眼，只见清晨初昇的阳光落在她的脸上，彷彿折射出来，带着淡淡温存。
	
