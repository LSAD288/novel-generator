	小白微笑，跟了上去。
	
	这个地方号称七里峒，自然是范围相当之大，而且号称是南疆边陲最大的苗人聚居之地，随着他们的深入，看到的苗人也越来越多。
	
	从他们行走的这条比较大的道路上，不断有分支小路向旁边延伸开去，就像是一棵大树开枝散叶。
	
