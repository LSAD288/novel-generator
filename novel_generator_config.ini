	这十年来，他从希望到失望再到几乎绝望，委实痛苦之极。如今突然有这么好的一个希望重新燃起，他无论如何也不肯轻易放过。可是如今此刻说话说不通，再比划动作却又害怕不好沟通，万一再莫名其妙触犯什么苗人忌讳，不免太过冤枉。
	
	他站在那里，强闯不行，退走更不情愿，左右为难，实在尴尬。
	
