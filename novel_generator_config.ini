	墨安尘点点头，侧身让他进来，又把门轻轻掩上。
	周小七把油纸包递过来，热气透过纸，有点烫手。“我娘烙的饼，还热乎，路上吃。”
	墨安尘接过来，没说话。饼的香气混着葱油味钻进鼻子，是实实在在的，暖的。他把它塞进自己怀里，贴着胸口放好。
	“家伙呢？”他问，声音不高。
	周小七拍拍背上的麻袋，发出硬物碰撞的闷响。“巷子老地方藏着呢，一会儿去拿。”他凑近一点，眼睛亮亮的，兴奋劲儿压不住，“尘哥，你说那药……真那么神？能让你……”
	
	“不知道。”墨安尘打断他，语气没什么起伏。他转身往屋里走，“等我一下。”
	再出来时，他手里多了个小布包，扁扁的，揣进怀里。两人一前一后出了院门。墨安尘走在后面，反手把门带上，木门合拢时发出“咔哒”一声轻响，在清晨的寂静里格外清晰。他站在门外，看着那扇熟悉的、漆皮有些剥落的门板，看了几秒钟。然后转身，和周小七并肩走进还未完全醒来的巷子。
	
	巷子窄而长，两边的土墙高耸，头顶的天空被切割成一道青灰色的细线。地上石板湿漉漉的，是昨夜的露水。偶尔有早起的老人开门泼水，看见他们，浑浊的眼睛抬一下，又漠然地垂下去，并不在意两个半大少年这么早要去哪里。
	走到巷子中段一个堆着破瓦罐的拐角，周小七左右看看，迅速闪进去。墨安尘站在外面，背靠着墙，目光落在对面墙根一丛蔫头耷脑的野草上。里面传来窸窸窣窣的声响，很快，周小七出来了，手里空着，但背上那个麻袋明显沉了许多，形状也变了，显出弓臂弯曲的轮廓。
	
	“走。”周小七说，声音有点喘。
	两人不再说话，脚步加快，专挑僻静的小路走。清晨的墨石镇像个慵懒的巨人，正在缓慢苏醒。远处传来零星的咳嗽声、开门声、水桶碰撞的咣当声，但都被薄雾稀释了，朦朦胧胧的，不真切。他们像两道影子，贴着墙根，滑过沉睡的屋檐和紧闭的门户。
	快到镇口时，人渐渐多了起来。推着独轮车的货郎，挑着菜担的农人，赶着驴车准备去远处收山货的行商，汇成一股稀疏的人流，朝着镇门蠕动。空气里混杂着牲口腔体的气味、蔬菜泥土的腥气、还有早起的人们身上隔夜的汗味。
	
	陆青禾就站在镇门边一棵老柳树下。
	墨安尘第一眼差点没认出来。她没穿昨天那件青色襦裙，而是一身灰扑扑的粗布男装，头发也全束进了同色的布巾里，只在鬓角露出几缕不服帖的碎发。脸上不知抹了什么，肤色暗了一层，原先那股书卷气被掩盖得七七八八，乍一看，像个清秀但不起眼的少年行商。只有那双眼睛，沉静的，看过来时，里面闪过一丝极淡的、难以捉摸的神色。
	
	周小七直接看呆了，张着嘴，直到陆青禾走到近前，才“啊”了一声，抓抓后脑勺，脸上有点红。
	陆青禾没理会他，目光在墨安尘脸上停了一瞬，随即垂下，从臂弯挎着的篮子里拿出两件叠好的粗布麻衣和两顶半旧的宽檐帽子，分别递给两人。衣服是深褐色的，浆洗得发硬，带着一股淡淡的、类似仓库的陈旧气味。
	“换上。”她说，声音也压低了，不像平时那样清柔。
	
	墨安尘和周小七对视一眼，接过衣服，走到柳树后面，三两下套在外面。帽子扣在头上，宽檐遮住了半张脸。再走出来时，三人站在一起，活脱脱就是三个起早赶路、风尘仆仆的小行商模样，混在进出镇门的人流里，毫不扎眼。
	陆青禾又从篮子里拿出一个空麻袋，示意周小七把背上那个装弓箭的袋子放进去。周小七照做。她把两样东西都塞进大麻袋，袋口扎紧，提在手里，掂了掂。
	
	“走吧。”她说，率先转身，汇入了出镇的人流。
	墨安尘跟在她侧后方，周小七走在另一边。守镇门的两个兵丁抱着长矛，倚在门洞边，睡眼惺忪地看着往来行人，偶尔伸手拦下个面生的盘问两句，更多时候只是摆摆手让人通过。
	他们混在几个推着山货的乡民后面，很顺利地出了镇门。清晨微凉的风迎面吹来，带着田野和远处山林的气息。身后的墨石镇在熹微的晨光里渐渐模糊成一片低矮的轮廓。
	
	谁也没注意到，镇门旁边那个用木板匆匆搭就的茅厕里，一个刚系好裤腰带的守卫一边揉着惺忪睡眼，一边往外走。他随意地朝出镇的人流扫了一眼，目光掠过那三个粗布麻衣的少年背影，正要移开，忽然顿了一下。他的视线落在中间那个略微清瘦些的背影上，帽檐遮住了脸，但那走路的姿势，那肩背的线条……有点眼熟。守卫眯起眼，想看得更清楚些，但那三人已经随着人流走远，拐上了通往黑风山林的土路，很快被树木和晨雾掩去了身形。
	
	守卫挠了挠脖子，咕哝了一句什么，打了个哈欠，晃悠着走回了自己的岗位。大概是看错了，他想。那个墨家的小子，一个修为停滞多年的废人，这么早出镇干什么去？多半是眼花了。
	他很快把这点疑惑抛在了脑后。天色还早，离换岗还有一阵子，他得找个地方再眯一会儿。
	镇外，土路向前延伸，两旁是开始返青的农田，更远处，黑沉沉的山林像一道巨大的、沉默的屏障，横亘在天边。天空刚泛起一丝鱼肚白，那点微弱的光，还不足以驱散山林边缘堆积的浓重阴影。
	
	三人走在路上，开始还能碰到三两个同样早起的农人或樵夫，互相并不搭话，只是沉默地交错而过。越往前走，人越稀少。土路渐渐被荒草侵蚀，变得狭窄颠簸。等到日头完全跃出远山，给大地铺上一层淡金色的光晕时，路上就只剩下他们三个了。
	周小七憋了一路，这会儿终于忍不住，话多了起来，一会儿猜测那株药的样子，一会儿说起以前跟父亲进山打猎的趣事，声音在空旷的路上显得格外响亮。陆青禾神色如常，脚步不疾不徐，只是偶尔会侧过头，目光掠过墨安尘沉静的脸，很快又收回去，看向前方越来越近的山林轮廓。墨安尘大部分时间沉默着，目光落在自己脚前一步远的地方，听着周小七的絮叨，听着风声穿过田野，听着远处山林里偶尔传来的、辨不清来源的窸窣声响。
	
	那声音很轻，被风扯碎了，传到他耳朵里时，只剩一点模糊的尾音。但他身体里那块“石头”，似乎微微动了一下，一种极其细微的、类似渴求的悸动，一闪而过。
	他抬起头，望向黑风山林。晨光下，那片山林苍黑如铁，林梢上空，隐约盘旋着几道淡淡的、灰白色的气流，不像雾，倒像某种凝固的寒意。
