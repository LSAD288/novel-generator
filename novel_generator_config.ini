	那些苗人士兵似也没想到这些苗族妇女会有这么大的怒火，居然比要对神明最忠贞的才能有资格守卫祭坛的战士还要更加愤怒，对这些侮辱了祭坛的外人如此深恶痛绝，以至于有什么轻微求情言论就被乱棒痛打。
	
