	只是随着他们渐渐深入，注意到他们二人行径的苗人也越来越多，周围窃窃私语声音此起彼伏。大约过了半盏茶的功夫。他们走到了那座祭坛的高大山脚之下。
	
	然后，他们停住了脚步，倒不是他们犹豫，而是苗人驻守在山脚的士兵将他们拦住了。
	
