	树皮上的那道深痕，硬，糙，指尖压上去，能感到底下更深层的木理。这是五年前，他刚满十一岁时用父亲给的短刀刻上去的。那天他刚突破到易筋阶，是墨石镇百年来最快达到这个境界的少年。刀锋划下去的时候，木屑簌簌地掉，他听见自己的心跳，像擂鼓。父亲站在旁边看，没说话，只是在他刻完后拍了拍他的肩膀。那手的重量，他现在还记得。
	
	风又吹过来，叶子哗啦哗啦响，像是底下藏了无数细碎的私语。披在肩上的外衣还带着皂角的淡香，混着院子里泥土夜里返上来的潮气。他站着，没动，手指还按在那道痕上。
	屋里灯灭了。
	窗户纸暗下去，最后一丝橘黄的光收进去，像合上了一只疲惫的眼睛。院子里只剩下月光，清冷冷的，把老槐树的影子拉得又长又瘦，匍匐在地上，像一滩化不开的墨。
	
	他收回手，转身朝自己那间小屋走。
	屋很小，挨着东墙，原来是放杂物的，他十岁后自己收拾出来。推开门，一股熟悉的、混着旧木头和干燥草药的味道涌出来。他没点灯，借着窗外的月光走到床边，坐下。床板硬，褥子薄，躺下去能听见底下竹篾受压的细微声响。
	他睁着眼，看着头顶的房梁。月光从瓦缝间漏下几缕，斜斜地，在地上切出几道惨白的口子。
	
	身体里的那个东西，还在。
	不是痛，也不是痒。是一种存在感，像胸腔里多了一块不属于自己的、冰冷的石头。它不动，不响，只是在那里，沉沉地坠着，提醒他这六年来每一个日夜的徒劳。他练拳，汗水砸在地上，血炁在筋脉里奔涌，然后像溪流汇入深潭，悄无声息地被吞没。它吸食他的血炁，也吸食侵入他体内的寒气和阴气，比如刚才陆青禾那间荒废小屋里的。那不是幻觉。他扶着墙出来时，指尖触及的湿冷，还有角落里佛像眼底一闪而过的白光，都是真的。有什么东西被吸走了，进了他身体里，然后消失了，像水渗进干涸的沙地。
	
	陆青禾的脸又浮上来。她说那株药的时候，眼睛很亮，兴奋，另一种东西，像在掂量，在试探。她为什么要帮他？这个问题像一根刺，卡在喉咙里，咽不下去，也吐不出来。六年了，足够让一个曾经跟在他身后，小声喊“尘哥哥”的小姑娘，变成如今这个站在废弃小屋中央，神色平静地展示一株“奇药”的陌生人。疏远是真的，那株药可能带来的希望，也是真的。
	
	他翻了个身，脸对着墙壁。墙壁是土坯的，摸上去粗糙，有颗粒感。明天一早，周小七会来。然后去镇口，和陆青禾汇合，进山。黑风山林。
	他闭上眼。呼吸渐渐沉下去，沉进一片粘稠的、没有边际的黑暗里。那块冰冷的石头还在，但意识已经模糊了。窗外，后半夜的风贴着墙根走过，卷起几片枯叶，沙沙的，响了一阵，又停了。
