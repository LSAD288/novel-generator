	人物感情发展创作规范
	
	
	核心总则
	
	
	人物感情发展必须严格遵循现实世界的人性规律、社交逻辑与完整的心理变化链条，彻底摒弃 “一眼定终身”“单次偶遇即念念不忘” 的悬浮叙事。所有正向爱慕、负面厌恶等情绪的产生、递进、转变与定型，必须同时具备可追溯的触发事件、合理的时间跨度、贴合人物人设的心理铺垫三大核心要素，确保情感发展真实可信、层次分明，完全贴合现实世界的情感生长逻辑，绝不出现无铺垫、无过程的跳变式情感。
	
	
	一、情感递进的硬性层级与落地规则
	
	
	情感发展不可跳级，必须遵循从浅到深的线性或螺旋式生长逻辑，每一层级的跃升，都必须满足对应的时间跨度、接触频次与信息增量要求，严禁无铺垫跨阶段升维。
	
	
	第一层级：初遇印象层
	
	
	这是单次或短时间接触后，仅能产生的瞬时情绪波动，无任何时间跨度要求，也是单次偶遇后唯一能达到的情感上限。
	
	
	此阶段的情感边界严格限定为：仅能产生轻微好奇、意外、瞬时惊艳，或是对应人物身份、处境的警惕与违和感。相关片段仅会在事件发生后的短时间内偶尔闪过，绝对不可占据人物日常的核心思绪，更不能打乱人物原本的生活节奏与既定行为逻辑，严禁单次见面就出现持续性的心神不宁、反复回想。
	
	
	第二层级：主动关注层
	
	
	从被动留下印象，转为主动留意对方相关信息的阶段，必须满足硬性前置条件：初遇后需有不少于 3 天的时间缓冲，且必须有至少 2 次的间接信息输入，比如旁人提及、看到对方的作品或事迹、侧面了解到对方的品行等，不可出现无理由的主动打探。
	
	
	此阶段的情感边界严格限定为：仅停留在信息收集层面，无明确的情感偏向，不会产生 “想要靠近、想要见面” 的主动诉求，更不允许出现脑补式的自我攻略。
	
	
	第三层级：好感积累层
	
	
	对对方产生稳定正面评价、萌生亲近意愿的阶段，必须满足硬性前置条件：从初遇到此阶段，需有不少于 15 天的时间跨度，且必须有至少 3 次的正面双向互动，每次互动必须带来新的信息增量，比如发现彼此三观契合、对方能力出众、人品可靠、能共情自己的隐秘需求等，不可重复无意义的无效接触。
	
	
	此阶段的情感边界严格限定为：好感仅能针对对方已展现出的具体特质，而非脑补出的完美形象；会产生主动见面的意愿，但仍受自身身份、处境、理智的严格约束，不会出现失控的情绪波动，日常行为仍以自身原本的生活主线为核心。
	
	
	第四层级：明确动心层
	
	
	从泛化好感，上升为专属男女爱慕之情的阶段，必须满足硬性前置条件：从初遇到此阶段，需有 1-3 个月的合理时间跨度（可根据故事主线节奏调整，但最短不可少于 1 个月）；必须有核心的 “破防事件”，比如对方在危难时的担当、跨越风险的善意、戳中内心隐秘缺口的理解；同时必须完成至少 1 次对对方的认知反转，比如从警惕到理解、从偏见到认可。
	
	
	此阶段的情感边界严格限定为：可出现持续性的情绪牵挂，理智与情感开始产生拉扯，但人物仍需具备基本的行为自控力；爱慕必须有明确的现实支撑，而非无厘头的执念，绝不允许为了对方直接突破自身的核心立场与人设底线。
	
	
	第五层级：深情执念层
	
	
	从动心升级为 “非对方不可” 的坚定选择、愿意为对方承担风险的阶段，必须满足硬性前置条件：从初遇到此阶段，需有 3 个月以上的时间跨度；必须有长期的双向奔赴、共同经历的重大事件、完成深度的灵魂与三观磨合；同时必须有双向、对等的情感付出，不可出现单方面自我感动式的执念。
	
	
	此阶段的情感边界严格限定为：情感优先级可与自身核心立场、人生规划并列，人物可做出合理的让步与牺牲，但仍需符合核心人设，绝不允许出现完全降智、无视现实风险的悬浮行为。
	
	
	二、初遇阶段的绝对红线（核心刚性约束）
	
	
	严禁单次或短时间初遇后，就出现持续性、占据人物核心思绪的 “恋恋不忘”，人物的日常行为、主线规划、情绪重心，不可被一个完全陌生的人彻底打乱；
	
	
	严禁初遇后就跳过 “关注 - 好感” 阶段，直接完成 “动心 - 深爱” 的情感跳级，哪怕是惊鸿一瞥的惊艳，也只能停留在瞬时情绪，不可直接转化为长期执念；
	
	
	严禁无视人物身份、成长环境的 “降智式心动”，尤其对于身处礼教约束、家族利益、权力漩涡中的人物，初遇陌生异性时，第一优先级必须是符合人设的警惕、边界感、风险预判，而非无底线的春心萌动；
	
	
	严禁无接触、无信息增量的 “脑补式恋恋不忘”，不可仅凭对方的外貌、一句话、一个动作，就脑补出对方的完整人设、对自己的心意，进而完成自我攻略式的情感闭环。
	
	
	三、情感创作的通用禁止性条款
	
	
	禁止情感发展无 “信息增量”，所有情感跃升必须有对应的事件支撑，不可靠重复的 “对视、心跳、脑补” 推动感情，每一次互动都要让人物对彼此的认知更完整；
	
	
	禁止双向情感进度严重失衡，不可出现一方仅露了个面、说了两句话，另一方就已经完成了从心动到非君不嫁 / 非卿不娶的全过程，双向情感的递进必须有来有回，进度基本匹配；
	
	
	禁止情感发展线性 “一路向上”，现实中的感情必然存在停滞、反复、退缩、怀疑，必须保留 “理智与情感的拉扯” 过程，不可直接跳过现实约束，全凭感性无阻碍推进；
	
	
	禁止为了推动感情，强行让人物放弃核心人设与核心利益，情感发展必须服务于人物弧光，而非让人物沦为感情的工具人。
	
	
	四、负面情感的对等创作规则
	
	
	厌恶、反感、敌意等负面情感的产生与转变，与正向情感遵循完全一致的创作逻辑：
	
	
	不可单次见面就对对方产生根深蒂固的厌恶、敌意，负面评价必须有可追溯的触发事件，不可无理由定性；
	
	
	负面情绪的升级，必须有对应的事件铺垫与时间跨度，不可仅凭传闻、刻板印象，就完成对一个人的全盘否定；
	
	
	从负面情绪转为正面情感，必须有更强的事件支撑与更长的时间跨度，严禁 “前一秒生死仇敌，后一秒一眼动心” 的悬浮反转。
	
	
	五、合规性自查标准（创作后校验用）
	
	
	时间线校验：梳理人物每一次情感跃升对应的故事时间线，确认是否有足够的时间缓冲，是否存在跳级式情感发展；
	
	
	心理逻辑校验：整理人物的心理变化链条，确认每一次情绪波动都有 “事件触发 - 心理变化 - 行为反馈” 的完整闭环，是否存在无中生有的情感；
	
	
	人设校验：确认情感发展的节奏、边界、行为选择，完全符合人物的出身、性格、成长环境与核心立场，是否出现人设崩塌的降智行为；
	
	
	现实逻辑校验：将情节代入现实世界，确认普通人在同等处境、同等接触频次下，是否会产生对应的情感，是否存在脱离现实的悬浮叙事。
	
