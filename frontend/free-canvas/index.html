<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>自由画布 · 炼笔智作</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-theme="light">
  <svg class="svg-sprite" aria-hidden="true">
    <defs>
      <symbol id="i-select" viewBox="0 0 24 24"><path d="m5 3 13 9-6 1.5L9 19 5 3Z"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6h14M12 6v14M8 20h8M5 6v3M19 6v3"/></symbol><symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 12V5a2 2 0 0 1 4 0v6-7a2 2 0 0 1 4 0v8-5a2 2 0 0 1 4 0v9c0 5-3 7-7 7-3 0-5-2-7-5l-3-4a2 2 0 0 1 3-3l2 2Z"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-card" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h5"/></symbol>
      <symbol id="i-connect" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M8.5 12h7"/></symbol>
      <symbol id="i-draw" viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z"/><path d="m14.5 7 3 3"/></symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m4 14 9-10a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-7 8H9l-5-4a2 2 0 0 1 0-2Z"/><path d="m8 10 9 8M9 20h12"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="m9 7-5 5 5 5M5 12h8a6 6 0 0 1 6 6"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 7 5 5-5 5M19 12h-8a6 6 0 0 0-6 6"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15.5A8 8 0 0 1 8.5 4 8.2 8.2 0 1 0 20 15.5Z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="m4 20 4.2-1 10.6-10.6a2.1 2.1 0 0 0-3-3L5.2 16 4 20Z"/><path d="m14.5 6.5 3 3"/></symbol>
      <symbol id="i-canvas" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h4v4H7zM14 12h3v4h-3z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></symbol>
      <symbol id="i-child" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/><path d="M5 5h5M5 5v5"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    </defs>
  </svg>

  <div id="app">
    <main class="main-content">
      <section id="writingView" hidden><textarea id="bodyEditor"></textarea><span id="writingCount"></span></section>
      <section id="canvasView" class="canvas-workspace" aria-label="自由画布">
        <div class="canvas-main">
          <div class="canvas-toolbar" role="toolbar" aria-label="画布工具">
            <div class="tool-group">
              <button class="tool-button" type="button" data-tool="select" aria-label="选择" aria-pressed="true" aria-keyshortcuts="V" title="选择（V）"><svg><use href="#i-select"></use></svg><span>选择</span><kbd>V</kbd></button>
              <button class="tool-button hand-tool" type="button" data-tool="pan" aria-label="手形" aria-pressed="false" aria-keyshortcuts="H" title="手形（H），也可按住空格拖动"><svg><use href="#i-hand"></use></svg><span>手形</span></button>
              <button class="tool-button" type="button" data-action="add-card" data-menu="cards" aria-label="卡片" aria-haspopup="dialog" aria-expanded="false" aria-keyshortcuts="N" title="新建卡片（N），或双击画布"><svg><use href="#i-card"></use></svg><span>卡片</span><kbd>N</kbd><span aria-hidden="true">⌄</span></button>
              <button class="tool-button" type="button" data-action="add-text" aria-label="文字" aria-keyshortcuts="T" title="文字（T）：双击编辑，拖动移动"><svg><use href="#i-text"></use></svg><span>文字</span><kbd>T</kbd></button>
              <button class="tool-button" type="button" data-tool="connect" aria-label="连线" aria-pressed="false" aria-keyshortcuts="C" title="连线（C）：先点起点，再点终点"><svg><use href="#i-connect"></use></svg><span>连线</span><kbd>C</kbd></button>
              <button class="tool-button" type="button" data-tool="draw" data-menu="draw" aria-label="手绘" aria-haspopup="dialog" aria-expanded="false" aria-pressed="false" aria-keyshortcuts="D" title="手绘（D），Esc 返回选择"><svg><use href="#i-draw"></use></svg><span>手绘</span><kbd>D</kbd><span aria-hidden="true">⌄</span></button>
            </div>
            <div class="tool-group history-tools"><button id="themeToggle" class="button quiet" type="button" aria-label="切换为深色外观"></button><button class="icon-button" type="button" data-action="undo" aria-label="撤销" title="撤销（⌘/Ctrl Z）"><svg><use href="#i-undo"></use></svg></button><button class="icon-button" type="button" data-action="redo" aria-label="重做" title="重做（⇧⌘/Ctrl Z）"><svg><use href="#i-redo"></use></svg></button></div>
          </div>

          <div id="canvasViewport" class="canvas-viewport" tabindex="0" aria-label="无限画布。拖动空白框选，Shift 点击多选，手形或空格平移，拖动蓝色角点缩放所选对象">
            <div id="canvasWorld" class="canvas-world">
              <svg id="edgeLayer" class="edge-layer" width="1" height="1" aria-label="卡片连线"><defs><marker id="arrow-marker" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"></path></marker></defs><g id="edgeGroup"></g></svg>
              <div id="cardLayer" class="card-layer"></div><div id="textLayer" class="text-layer"></div>
              <svg id="strokeLayer" class="stroke-layer" width="1" height="1" aria-label="手绘笔迹"><g id="strokeGroup"></g></svg>
              <svg id="draftLayer" class="draft-layer" width="1" height="1" aria-hidden="true"><path id="draftPath" d=""></path></svg>
              <div id="selectionLayer" class="selection-layer"></div><div id="marquee" class="selection-marquee" hidden></div>
            </div>
            <div class="zoom-controls" aria-label="画布缩放"><button class="icon-button" type="button" data-action="zoom-out" aria-label="缩小"><svg><use href="#i-minus"></use></svg></button><button id="zoomLabel" class="zoom-label" type="button" data-action="zoom-reset" title="回到 100%">100%</button><button class="icon-button" type="button" data-action="zoom-in" aria-label="放大"><svg><use href="#i-plus"></use></svg></button><span class="zoom-divider"></span><button class="button quiet fit-button" type="button" data-action="fit-content"><svg><use href="#i-fit"></use></svg>适应</button></div>
          </div>

          <footer class="canvas-status"><span id="saveStatus" role="status">正在加载…</span><span id="objectStatus">5 张卡片 · 4 条连线 · 0 笔笔迹</span><span class="canvas-hints">拖动空白框选 · Shift 多选 · 空格/手形平移 · 双击新建</span></footer>
        </div>

        <div id="inspectorBackdrop" class="inspector-backdrop" data-action="close-inspector" aria-hidden="true"></div>
        <aside id="inspector" class="inspector" aria-label="选中项详情">
          <div class="inspector-mobile-head"><strong>选中项详情</strong><button class="icon-button" type="button" data-action="close-inspector" aria-label="关闭详情"><svg><use href="#i-close"></use></svg></button></div>
          <div id="inspectorContent" class="inspector-content"></div>
        </aside>
      </section>
    </main>
  </div>

  <div id="cardOptions" class="canvas-options card-options" role="dialog" aria-label="卡片形态" hidden>
    <button type="button" data-action="add-shaped-card" data-shape="rectangle">▭ 方卡</button>
    <button type="button" data-action="add-shaped-card" data-shape="circle">◯ 圆卡</button>
  </div>
  <div id="drawOptions" class="canvas-options draw-options" role="dialog" aria-label="手绘与橡皮" hidden>
    <div class="ink-mode-tabs"><button type="button" data-ink-mode="draw">画笔</button><button type="button" data-ink-mode="erase">橡皮擦</button></div>
    <section data-ink-panel="draw">
      <label>笔类<select id="inkBrush" aria-label="笔类"><option value="pencil">铅笔</option><option value="crayon">蜡笔</option><option value="brush">毛笔</option></select></label>
      <label>粗细 <output id="inkWidthValue">3</output><input id="inkWidth" type="range" min="1" max="32" step="0.5" value="3" aria-label="画笔粗细"></label>
      <div id="inkColors"></div>
      <label class="canvas-check"><input id="inkPressure" type="checkbox" checked>跟随手写笔压感</label>
      <label>压力强度 <output id="inkPressureValue">75%</output><input id="inkStrength" type="range" min="0" max="100" value="75" aria-label="压力强度"></label>
      <p class="canvas-option-help">手写笔使用实际压力；鼠标为固定粗细，毛笔保留自然收笔。</p>
    </section>
    <section data-ink-panel="erase" hidden>
      <label>擦除方式<select id="eraserMode" aria-label="擦除方式"><option value="point">局部橡皮</option><option value="stroke">整笔橡皮</option><option value="area">框选橡皮</option></select></label>
      <label>大小 <output id="eraserSizeValue">24</output><input id="eraserSize" type="range" min="8" max="80" step="4" value="24" aria-label="橡皮大小"></label>
      <div class="eraser-preview-wrap" aria-label="橡皮实际大小预览"><span id="eraserPreview" class="eraser-preview"></span></div><p class="canvas-option-help">局部橡皮只擦经过的部分；整笔和框选删除命中的整笔。三种橡皮都不删除卡片或连线，可撤销。</p>
    </section>
    <button type="button" data-action="close-options">完成设置</button>
  </div>
  <div id="eraserCursor" class="eraser-cursor" hidden aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./vendor/perfect-freehand.js"></script>
  <script src="./ink.js"></script>
  <script src="./controls.js"></script>
  <script src="./app.js"></script>
</body>
</html>
