name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Fix JAVA_HOME with symlink
      run: |
        echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64"
        echo "Current JAVA_HOME=$JAVA_HOME"
        if [ -d "/usr/lib/jvm/java-17-openjdk-amd64" ]; then
          sudo rm -rf /usr/lib/jvm/java-17-openjdk-amd64
        fi
        sudo ln -sf "$JAVA_HOME_17_X64" /usr/lib/jvm/java-17-openjdk-amd64
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
        echo "PATH=$JAVA_HOME_17_X64/bin:$PATH" >> $GITHUB_ENV
        ls -la /usr/lib/jvm/java-17-openjdk-amd64/bin/java
        java -version
        
    - name: Install system dependencies
      run: |
        sudo apt-get update || true
        sudo apt-get install -y --no-install-recommends \
          python3-pip python3-venv git unzip wget \
          autoconf automake libtool \
          pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo5 cmake libffi-dev libssl-dev \
          libsqlite3-dev libjpeg-dev libpng-dev \
          libltdl-dev build-essential || true
        sudo apt-get install -f || true
          
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv
        
    - name: Cache Buildozer dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          ~/.gradle
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-
          
    - name: Verify environment
      run: |
        echo "JAVA_HOME=$JAVA_HOME"
        java -version
        javac -version
        which java
        ls -la /usr/lib/jvm/ | grep java-17
        echo "=== Project files ==="
        ls -la *.py 2>/dev/null || echo "No .py files"
        
    - name: Build APK
      run: |
        export JAVA_HOME=$JAVA_HOME_17_X64
        export PATH=$JAVA_HOME/bin:$PATH
        echo "Building with JAVA_HOME=$JAVA_HOME"
        java -version
        buildozer android debug 2>&1 | tee build.log
      timeout-minutes: 90
      
    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: build.log
        retention-days: 7
        
    - name: Check APK exists
      run: |
        if ls bin/*.apk 1>/dev/null 2>&1; then
          echo "APK built successfully!"
          ls -lh bin/*.apk
        else
          echo "APK not found. Last 200 lines of build log:"
          tail -200 build.log
          exit 1
        fi
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: novel-generator-apk
        path: bin/*.apk
        retention-days: 30
        
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        files: bin/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
